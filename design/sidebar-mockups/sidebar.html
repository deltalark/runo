<!doctype html>
<!--
  Sidebar redesign mockups: Crew's threads only under Crew, the person's own sessions below.
  Open with ?v=before|a|b&t=light|dark (render.sh makes the PNGs).
  Colours are Runo's own: the "runo" light palette and "tokyo-night" dark (themes.rs),
  indigo accent 0x3b5bdb in light, the theme's 0x7aa2f7 in dark.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  :root[data-t=light] {
    --canvas:#ffffff; --sheet:#f4f4f6; --subtle:#ebebee; --border:#e5e5e8; --active:#e4e4e8;
    --text:#18181b; --secondary:#55555e; --muted:#8a8a94; --green:#16a34a; --amber:#f0a020;
    --amber-text:#b7700a; --red:#dc2626; --accent:59,91,219; --add:#16a34a; --del:#dc2626;
    --wash:0.063; --wash-edge:0.22; --guide:0.29; --amber-wash:rgba(240,160,32,.16);
    --note:#e0488b;
  }
  :root[data-t=dark] {
    --canvas:#1a1b26; --sheet:#1f2030; --subtle:#262840; --border:#2a2e42; --active:#2e3350;
    --text:#c0caf5; --secondary:#a9b1d6; --muted:#737aa2; --green:#9ece6a; --amber:#e0af68;
    --amber-text:#e0af68; --red:#f7768e; --accent:122,162,247; --add:#9ece6a; --del:#f7768e;
    --wash:0.086; --wash-edge:0.25; --guide:0.33; --amber-wash:rgba(224,175,104,.2);
    --note:#ff7ab6;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; background:var(--canvas); color:var(--text);
    display:flex; width:760px; min-height:100vh;
  }
  body.wide { width:1040px; }
  body.wide .page { padding-left:310px; }
  body.before .page { padding-left:46px; }
  .side { width:264px; flex:none; background:var(--sheet); border-right:1px solid var(--border);
    padding:10px 6px 16px 6px; position:relative; }
  .page { flex:1; padding:26px 30px; position:relative; }
  .search { height:28px; margin:0 4px 10px; border-radius:8px; background:var(--subtle);
    display:flex; align-items:center; gap:7px; padding:0 9px; color:var(--muted); font-size:12px; }
  .proj { height:28px; display:flex; align-items:center; gap:6px; padding:0 6px; font-size:13px;
    font-weight:600; color:var(--text); }
  .proj .sub { font-weight:400; color:var(--muted); font-size:11px; margin-left:auto; }
  .proj.closed { color:var(--secondary); font-weight:500; }
  .rows { padding-left:15px; display:flex; flex-direction:column; gap:2px; margin:2px 0 6px; }
  svg { flex:none; display:block; }

  /* Crew row, as in #238 */
  .crew { height:34px; padding:0 8px 0 6px; display:flex; align-items:center; gap:8px; border-radius:6px;
    background:rgba(var(--accent),var(--wash)); border:1px solid rgba(var(--accent),var(--wash-edge)); }
  .chip { width:22px; height:22px; border-radius:6px; background:rgba(var(--accent),.15);
    display:flex; align-items:center; justify-content:center; position:relative;
    border:1px solid rgba(var(--accent),.8); }
  .chip::before { content:""; position:absolute; inset:-4px; border-radius:8px; background:rgba(var(--accent),.13); z-index:-1; }
  .crew .name { flex:1; font-size:13px; font-weight:600; }
  .pill { padding:1px 7px; border-radius:99px; font-size:10.5px; font-weight:500; white-space:nowrap; }
  .pill.amber { background:var(--amber-wash); color:var(--amber-text); }
  .pill.acc { background:rgba(var(--accent),.11); color:rgb(var(--accent)); }

  .guide { margin:1px 0 4px 17px; padding-left:6px; border-left:2px solid rgba(var(--accent),var(--guide));
    display:flex; flex-direction:column; gap:1px; }
  .group { height:22px; display:flex; align-items:flex-end; padding:0 8px 3px; font-size:10.5px; font-weight:600;
    color:var(--muted); letter-spacing:.01em; }
  .group:first-child { height:18px; }
  .group .n { margin-left:5px; font-weight:500; opacity:.8; }

  .t { position:relative; border-radius:6px; padding:0 8px; display:flex; align-items:center; gap:8px; font-size:12.5px;
    color:var(--secondary); }
  .t.one { height:28px; }
  .t.two { height:42px; align-items:flex-start; padding-top:5px; }
  .t .glyph { width:14px; height:16px; flex:none; display:flex; align-items:center; justify-content:center; }
  .t .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:2px; }
  .t .l1 { display:flex; align-items:center; gap:6px; min-width:0; height:16px; }
  .t .title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t .age { flex:none; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .t .age.live { color:rgb(var(--accent)); }
  .t .age.amber { color:var(--amber-text); }
  .t .l2 { display:flex; align-items:center; gap:5px; font-size:11px; color:var(--muted); min-width:0; height:14px; }
  .t .l2 .br { min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t .l2 .ask { color:var(--amber-text); min-width:0; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .t .meta { flex:none; display:flex; gap:5px; align-items:center; }
  .t.sel { background:var(--active); color:var(--text); box-shadow:inset 0 0 0 1px rgba(var(--accent),.38); }
  .t.sel .title { font-weight:500; }
  .t.hov { background:var(--subtle); }
  .t.unread .title { color:var(--text); font-weight:500; }
  .t.done { color:var(--secondary); }
  .tag { font-size:10.5px; padding:0 5px; border-radius:4px; line-height:15px; background:var(--subtle); color:var(--muted); white-space:nowrap; }
  .tag.pr { color:rgb(var(--accent)); background:rgba(var(--accent),.1); }
  .tag.ok { color:var(--green); }
  .diff { font-family:"SF Mono",Menlo,monospace; font-size:10.5px; display:flex; gap:4px; }
  .diff .a { color:var(--add); } .diff .d { color:var(--del); }

  .fold { height:26px; display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:6px; font-size:12px; color:var(--muted); }
  .fold .glyph { width:14px; display:flex; justify-content:center; }
  .fold .lbl { flex:1; }
  .more { height:24px; display:flex; align-items:center; padding:0 8px 0 30px; font-size:11.5px; color:rgb(var(--accent)); }

  .hair { height:1px; background:var(--border); margin:6px 8px; }
  .sect { height:24px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 8px 4px 8px;
    font-size:10.5px; font-weight:600; color:var(--muted); }

  /* The person's own sessions, as session_row draws them today */
  .s { position:relative; margin:0 4px; padding:5px 8px; display:flex; align-items:center; gap:9px; border-radius:11px; }
  .av { width:24px; height:24px; border-radius:7px; flex:none; display:flex; align-items:center; justify-content:center; position:relative; }
  .av .st { position:absolute; right:-3px; bottom:-3px; width:10px; height:10px; border-radius:50%; background:var(--sheet);
    display:flex; align-items:center; justify-content:center; }
  .av .st i { width:7px; height:7px; border-radius:50%; display:block; }
  .s .body { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .s .l1 { display:flex; align-items:center; gap:4px; }
  .s .title { flex:1; min-width:0; font-size:12.5px; color:var(--secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .s .sub { font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .s .rt { flex:none; display:flex; flex-direction:column; align-items:flex-end; font-size:10px; color:var(--muted); gap:1px; }
  .s.dup { outline:1.5px dashed var(--note); outline-offset:-1px; }

  /* Hover card for variant A */
  .card { position:absolute; width:250px; background:var(--canvas); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 8px 28px rgba(0,0,0,.16), 0 1px 3px rgba(0,0,0,.08); padding:11px 12px; font-size:11.5px; color:var(--secondary); z-index:5; }
  :root[data-t=dark] .card { background:#24263a; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .card h4 { margin:0 0 3px; font-size:12.5px; font-weight:600; color:var(--text); }
  .card .status { color:var(--muted); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .card .kv { display:grid; grid-template-columns:72px 1fr; row-gap:4px; }
  .card .k { color:var(--muted); }
  .card .v { display:flex; align-items:center; gap:5px; min-width:0; }
  .card .v span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Notes column */
  .page h1 { font-size:17px; margin:0 0 4px; font-weight:650; }
  .page .lead { font-size:12.5px; color:var(--secondary); margin:0 0 18px; line-height:1.5; }
  .page ol, .page ul { margin:0; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:12px; }
  .page li { font-size:12.5px; line-height:1.5; color:var(--secondary); display:flex; gap:10px; }
  .page li b { color:var(--text); font-weight:600; }
  .num { flex:none; width:19px; height:19px; border-radius:50%; background:var(--note); color:#fff; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .dot { flex:none; width:6px; height:6px; border-radius:50%; background:rgb(var(--accent)); margin:7px 6px 0 6px; }
  .mark { position:absolute; z-index:6; }
  .legend { margin-top:22px; padding-top:16px; border-top:1px solid var(--border); font-size:11.5px; color:var(--muted);
    display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; }
  .legend .g { width:14px; display:flex; justify-content:center; }
</style>
</head>
<body>
<div class="side" id="side"></div>
<div class="page" id="page"></div>
<script>
const q = new URLSearchParams(location.search);
const V = q.get("v") || "a", T = q.get("t") || "light";
document.documentElement.dataset.t = T;
const DARK = T === "dark";
document.body.classList.add(V === "a" ? "wide" : V === "before" ? "before" : "x");

// ---- Icons ----
const I = {
  search: c => `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>`,
  chevD: c => `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>`,
  chevR: c => `<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>`,
  folder: c => `<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.4" stroke-linejoin="round"><path d="M2 4.5c0-.8.6-1.5 1.5-1.5h3l1.5 1.5h4.5c.8 0 1.5.7 1.5 1.5v5.5c0 .8-.7 1.5-1.5 1.5h-9C2.7 13 2 12.3 2 11.5z"/></svg>`,
  plus: c => `<svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`,
  crew: (c, s=14) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.5" stroke-linecap="round"><circle cx="6" cy="5.5" r="2.3"/><path d="M1.8 13c.4-2.3 2.1-3.6 4.2-3.6s3.8 1.3 4.2 3.6"/><circle cx="11.4" cy="5.8" r="1.8"/><path d="M11.2 9.4c1.7 0 2.8 1.1 3.1 3"/></svg>`,
  check: (c, s=12) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>`,
  branch: (c, s=10) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/><circle cx="11.5" cy="5" r="1.6"/><path d="M4.5 5.1v5.8M11.5 6.6c0 3-4.2 2.4-6.6 4.6"/></svg>`,
  pr: (c, s=10) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><circle cx="4" cy="3.5" r="1.6"/><circle cx="4" cy="12.5" r="1.6"/><circle cx="12" cy="12.5" r="1.6"/><path d="M4 5.1v5.8M12 10.9V6.5c0-1.2-.8-2-2-2H7.5M9 3 7.4 4.5 9 6"/></svg>`,
  disk: (c, s=10) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.5"><rect x="2" y="9" width="12" height="4.5" rx="1.3"/><path d="M3 9l1.6-5h6.8L13 9"/><circle cx="11" cy="11.25" r=".6" fill="${c}"/></svg>`,
  clock: (c, s=10) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${c}" stroke-width="1.6" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>`,
};
// Agent marks, in agents.json colours.
const AG = {
  claude: { name:"Claude Code", color:"#d9633f",
    mark:(s=12)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16"><g stroke="#d9633f" stroke-width="2" stroke-linecap="round">${[0,30,60,90,120,150].map(a=>`<path transform="rotate(${a} 8 8)" d="M8 1.6v12.8"/>`).join("")}</g></svg>` },
  codex: { name:"Codex", color:"#1767e8",
    mark:(s=12)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="${DARK?"#6aa0ff":"#1767e8"}" stroke-width="1.7" stroke-linejoin="round"><path d="M8 1.8l5.4 3.1v6.2L8 14.2l-5.4-3.1V4.9z"/><path d="M5.6 6.6 7.6 8l-2 1.4M8.6 10h2" stroke-linecap="round"/></svg>` },
  opencode: { name:"OpenCode", color:"#258a5b",
    mark:(s=12)=>`<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" stroke="#258a5b" stroke-width="1.8"><rect x="3" y="3" width="10" height="10" rx="2"/><path d="M6 8h4" stroke-linecap="round"/></svg>` },
};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { accent:`rgb(${css("--accent")})`, muted:css("--muted"), secondary:css("--secondary"),
  green:css("--green"), amber:css("--amber"), text:css("--text"), note:css("--note") };
const spinner = () => `<svg width="11" height="11" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="${C.accent}" stroke-opacity=".22" stroke-width="2.4"/><path d="M8 2a6 6 0 0 1 6 6" stroke="${C.accent}" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const dot = c => `<i style="width:7px;height:7px;border-radius:50%;background:${c};display:block"></i>`;
const ring = c => `<i style="width:8px;height:8px;border-radius:50%;border:1.6px solid ${c};display:block"></i>`;
const glyph = st => ({ needs: dot(C.amber), working: spinner(), waiting: ring(C.muted), done: I.check(C.green) })[st];
const mark = (n, a=12) => `<span class="num" style="width:${a+7}px;height:${a+7}px">${n}</span>`;
const diff = (a, d) => `<span class="diff"><span class="a">+${a}</span><span class="d">−${d}</span></span>`;

// ---- Data: Crew's threads ----
const THREADS = [
  { st:"needs", title:"Dock icon badge count", ag:"claude", br:"runo/dock-icon-badge", age:"12m", ask:"Badge every window, or only the front one?", size:"640 MB" },
  { st:"working", title:"App startup time", ag:"claude", br:"runo/app-startup-time", age:"4m", started:"9:38 PM", size:"1.2 GB", diff:[148,61], sel:true },
  { st:"working", title:"Thread pane scroll jump", ag:"codex", br:"runo/thread-pane-scroll", age:"9m", size:"910 MB", unread:true },
  { st:"working", title:"Sidebar redesign mockups", ag:"claude", br:"runo/sidebar-redesign-mockups", age:"2m", size:"310 MB" },
  { st:"waiting", title:"Playful Arcade red theme", ag:"claude", br:"runo/playful-arcade-red", age:"38m", pr:249, size:"860 MB", diff:[212,40], why:"CI running", hov:true },
  { st:"waiting", title:"Highlight Crew in sidebar", ag:"codex", br:"runo/highlight-crew", age:"1h", pr:251, size:"1.0 GB", why:"Waiting for review" },
];
const DONE = [
  { title:"Test data_dir env fallback", pr:248, age:"2h" },
  { title:"Typos in git guide", pr:250, age:"3h" },
  { title:"Stunning working indicator", pr:247, age:"5h" },
  { title:"Refine Arcade: pro + fun", pr:243, age:"1d" },
];
const DONE_N = 13;
// ---- The person's own sessions ----
const OWN = [
  { title:"Add a guide page for docs", ag:"claude", sub:"runo/docs-guide-page", when:"8:12 PM", diff:[86,4], state:"finished" },
  { title:"Update the docs", ag:"codex", sub:"Codex · gpt-5.5", when:"Oct 22" },
  { title:"Bump gpui and fix warnings", ag:"claude", sub:"runo/gpui-bump", when:"Oct 21", diff:[31,27] },
  { title:"Try list virtualisation", ag:"opencode", sub:"runo/list-virtual", when:"Oct 19" },
];

// ---- Pieces ----
const search = `<div class="search">${I.search(C.muted)}Search sessions</div>`;
const projHead = (name, open, sub="") => `<div class="proj ${open?"":"closed"}">${(open?I.chevD:I.chevR)(C.muted)}${I.folder(open?C.secondary:C.muted)}<span>${name}</span>${sub?`<span class="sub">${sub}</span>`:""}</div>`;
const crewRow = badge => `<div class="crew"><div class="chip">${I.crew(C.accent)}</div><div class="name">Crew</div>${badge}</div>`;
function sessionRow(s, opts={}) {
  const ag = AG[s.ag];
  const st = s.state === "finished" ? C.accent : s.state === "working" ? C.accent : C.muted;
  return `<div class="s ${opts.cls||""}" ${opts.id?`id="${opts.id}"`:""}>
    <div class="av" style="background:${ag.color}24">${ag.mark(12)}<span class="st"><i style="background:${st}"></i></span></div>
    <div class="body"><div class="l1"><span class="title" ${s.unread?'style="color:var(--text);font-weight:500"':""}>${s.title}</span>${s.crew?I.crew(C.muted,11):""}</div>
      <div class="sub">${s.sub}</div></div>
    <div class="rt"><span>${s.when}</span>${s.diff?diff(...s.diff):""}</div></div>`;
}
function doneFold(open) {
  return `<div class="fold"><span class="glyph">${I.check(C.green)}</span><span class="lbl">${DONE_N} done</span>${(open?I.chevD:I.chevR)(C.muted)}</div>`;
}
const groupHead = (label, n) => `<div class="group">${label}<span class="n">${n}</span></div>`;

// ---- Variant rows ----
function rowA(t) {
  const ag = AG[t.ag];
  const cls = ["t", t.sel ? "two sel" : "one", t.hov ? "hov" : "", t.unread ? "unread" : ""].join(" ");
  const ageCls = t.st === "working" ? "live" : t.st === "needs" ? "amber" : "";
  const l2 = t.sel ? `<div class="l2">${ag.mark(10)}<span class="br">${t.br}</span><span class="meta"><span class="tag">${t.size}</span></span></div>` : "";
  return `<div class="${cls}" ${t.hov?'id="hov"':""}><span class="glyph">${glyph(t.st)}</span>
    <div class="body"><div class="l1"><span class="title">${t.title}</span><span class="age ${ageCls}">${t.age}</span></div>${l2}</div></div>`;
}
function rowB(t) {
  const ag = AG[t.ag];
  const cls = ["t two", t.sel ? "sel" : "", t.unread ? "unread" : ""].join(" ");
  const ageCls = t.st === "working" ? "live" : t.st === "needs" ? "amber" : "";
  let meta = "";
  if (t.pr) meta = `<span class="tag pr">#${t.pr}</span>`;
  else if (t.diff) meta = diff(...t.diff);
  const second = t.st === "needs"
    ? `${ag.mark(10)}<span class="ask">${t.ask}</span>`
    : `${ag.mark(10)}<span class="br">${t.br}</span><span class="meta">${meta}</span>`;
  return `<div class="${cls}"><span class="glyph">${glyph(t.st)}</span>
    <div class="body"><div class="l1"><span class="title">${t.title}</span><span class="age ${ageCls}">${t.age}</span></div>
    <div class="l2">${second}</div></div></div>`;
}
const doneRow = d => `<div class="t one done"><span class="glyph">${glyph("done")}</span><div class="body"><div class="l1"><span class="title">${d.title}</span><span class="tag pr" style="opacity:.85">#${d.pr}</span></div></div></div>`;

function crewBlock(row, unfold) {
  const by = st => THREADS.filter(t => t.st === st);
  let h = crewRow(`<span class="pill amber">1 needs you</span>`);
  h += `<div class="guide">`;
  h += groupHead("Needs you", by("needs").length) + by("needs").map(row).join("");
  h += groupHead("Working", by("working").length) + by("working").map(row).join("");
  h += groupHead("Waiting", by("waiting").length) + by("waiting").map(row).join("");
  h += `<div style="height:4px"></div>` + doneFold(unfold);
  if (unfold) h += DONE.map(doneRow).join("") + `<div class="more">Show ${DONE_N - DONE.length} more</div>`;
  h += `</div>`;
  return h;
}
function ownSessions() {
  return `<div class="hair"></div><div class="sect"><span>Sessions</span>${I.plus(C.muted)}</div>` + OWN.map(s => sessionRow(s)).join("");
}
const tail = projHead("gpui-kit", false, "3") + projHead("deltalark.dev", false, "1");

// ---- Pages ----
const side = document.getElementById("side"), page = document.getElementById("page");
const themeName = DARK ? "Dark" : "Light";
const legend = `<div class="legend">
  <span class="g">${dot(C.amber)}</span><span>Needs you: Crew is waiting on your answer</span>
  <span class="g">${spinner()}</span><span>Working: the agent is running</span>
  <span class="g">${ring(C.muted)}</span><span>Waiting: on CI, review or another thread</span>
  <span class="g">${I.check(C.green)}</span><span>Done: folded into “N done”, opens in place</span></div>`;

if (V === "before") {
  // Today's sidebar, recreated from the person's screenshot and main.rs / crew_view.rs.
  const open = THREADS.map(t => `<div class="t one ${t.sel?"sel":""}"><span class="glyph">${glyph(t.st === "waiting" ? "waiting" : t.st)}</span><div class="body"><div class="l1"><span class="title">${t.title}</span>${t.diff?diff(...t.diff):""}</div></div></div>`).join("");
  const done = ["Test data_dir env fallback","Typos in git guide","Stunning working indicator","Low priority background checks","Refine Arcade: pro + fun"]
    .map(x => `<div class="t one done"><span class="glyph">${glyph("done")}</span><div class="body"><div class="l1"><span class="title">${x}</span></div></div></div>`).join("");
  const dups = [
    { title:"App startup time", ag:"claude", sub:"runo/app-startup-time", when:"9:38 PM", crew:1, diff:[148,61] },
    { title:"Thread pane scroll jump", ag:"codex", sub:"runo/thread-pane-scroll", when:"9:31 PM", crew:1 },
    { title:"Playful Arcade red theme", ag:"claude", sub:"runo/playful-arcade-red", when:"9:02 PM", crew:1, diff:[212,40] },
    { title:"Dock icon badge count", ag:"claude", sub:"runo/dock-icon-badge", when:"8:58 PM", crew:1 },
    { title:"Highlight Crew in sidebar", ag:"codex", sub:"runo/highlight-crew", when:"8:40 PM", crew:1 },
  ];
  const mixed = [OWN[0], { title:"Test data_dir env fallback", ag:"claude", sub:"runo/data-dir-env", when:"7:15 PM", crew:1 }, OWN[1], { title:"Typos in git guide", ag:"claude", sub:"runo/git-guide-typos", when:"Oct 22", crew:1 }];
  side.innerHTML = search + projHead("runo-lab", true) + `<div class="rows">` + crewRow(`<span class="pill amber">1 needs you</span>`)
    + `<div class="guide" id="kids">${open}<div class="fold" id="fold"><span class="glyph">${I.check(C.green)}</span><span class="lbl">13 done</span>${I.chevD(C.muted)}</div>${done}</div>`
    + `<div class="hair" id="hair"></div>`
    + dups.map((s,i) => sessionRow(s, { cls:"dup", id: i===0?"dup0":"" })).join("")
    + mixed.map((s,i) => sessionRow(s, { cls: s.crew ? "dup" : "", id: i===0?"own0":"" })).join("")
    + `</div>` + tail;
  page.innerHTML = `<h1>Before: today’s sidebar (${themeName})</h1>
    <p class="lead">Recreated from the screenshots and the current code. Dashed outlines mark rows that repeat a Crew thread.</p>
    <ol>
      <li>${mark(1)}<span><b>Crew’s threads have no details.</b> Each is one line: a status glyph, the title and a diff. You can’t see the branch, the agent, the time or the PR without opening it.</span></li>
      <li>${mark(2)}<span><b>No order by what needs you.</b> The amber “needs you” thread sits in with the working ones, and the waiting ones look like the working ones.</span></li>
      <li>${mark(3)}<span><b>The same threads come again below the line</b> as ordinary session rows, with the agent tile, branch and time, and a small Crew mark as the only hint.</span></li>
      <li>${mark(4)}<span><b>Your own sessions are mixed in</b> with those repeats (“Add a guide page…”, “Update the docs”), sorted by time, so they’re hard to find.</span></li>
    </ol>`;
  // Callout markers on the sidebar.
  requestAnimationFrame(() => {
    const at = (id, n, dy=0) => { const el = document.getElementById(id); if (!el) return; const r = el.getBoundingClientRect();
      const m = document.createElement("div"); m.className = "mark"; m.innerHTML = mark(n, 11); m.style.left = "272px"; m.style.top = (r.top + dy) + "px"; document.body.appendChild(m); };
    at("kids", 1, 4); at("kids", 2, 34); at("dup0", 3, 8); at("own0", 4, 8);
  });
} else {
  const isA = V === "a";
  const unfold = DARK; // light shows "13 done" folded, dark shows it opened in place
  side.innerHTML = search + projHead("runo-lab", true) + `<div class="rows">` + crewBlock(isA ? rowA : rowB, unfold) + ownSessions() + `</div>` + tail;
  const foldNote = unfold ? "“13 done” is shown opened here: finished threads in place, newest first, with their PR." : "“13 done” is folded here; it opens in place (the dark image shows it open).";
  if (isA) {
    page.innerHTML = `<h1>Variant A: one-line Crew threads (${themeName})</h1>
      <p class="lead">Crew’s threads live only under Crew, grouped by what they need from you. Rows stay one line (28 px) with just the time or elapsed; the details come on hover or when selected.</p>
      <ul>
        <li><span class="dot"></span><span><b>Grouped:</b> Needs you, Working, Waiting, then Done. Small group labels with counts; empty groups don’t show.</span></li>
        <li><span class="dot"></span><span><b>Selected</b> (“App startup time”) grows to two lines in place: agent, branch and worktree size, with the selection outline from #238.</span></li>
        <li><span class="dot"></span><span><b>Hover</b> (“Playful Arcade red theme”) opens a card with everything: status, agent, branch, PR, size, start time and changes.</span></li>
        <li><span class="dot"></span><span>${foldNote}</span></li>
        <li><span class="dot"></span><span><b>Sessions</b> below lists only the ones you started, never a Crew thread, drawn as today.</span></li>
      </ul>${legend}`;
    requestAnimationFrame(() => {
      const r = document.getElementById("hov").getBoundingClientRect();
      const t = THREADS.find(x => x.hov), ag = AG[t.ag];
      const card = document.createElement("div"); card.className = "card";
      card.style.left = (r.right + 10) + "px"; card.style.top = (r.top - 8) + "px";
      card.innerHTML = `<h4>${t.title}</h4><div class="status">${ring(C.muted)}Waiting · ${t.why}</div>
        <div class="kv"><span class="k">Agent</span><span class="v">${ag.mark(11)}<span>${ag.name} · Opus</span></span>
        <span class="k">Branch</span><span class="v">${I.branch(C.muted,11)}<span>${t.br}</span></span>
        <span class="k">Pull request</span><span class="v">${I.pr(C.accent,11)}<span style="color:${C.accent}">#${t.pr} · checks running</span></span>
        <span class="k">Worktree</span><span class="v">${I.disk(C.muted,11)}<span>${t.size}</span></span>
        <span class="k">Started</span><span class="v">${I.clock(C.muted,11)}<span>9:02 PM · 38m ago</span></span>
        <span class="k">Changes</span><span class="v">${diff(...t.diff)}<span style="color:${C.muted}">in 7 files</span></span></div>`;
      document.body.appendChild(card);
      // A pointer at the hovered row.
      const p = document.createElement("div"); p.className = "mark";
      p.innerHTML = `<svg width="14" height="18" viewBox="0 0 14 18"><path d="M1 1l11 9.5-5 .6 3 5.7-2 1-3-5.8L1 15z" fill="${DARK?"#fff":"#111"}" stroke="${DARK?"#111":"#fff"}" stroke-width="1.2"/></svg>`;
      p.style.left = (r.left + 150) + "px"; p.style.top = (r.top + 12) + "px"; document.body.appendChild(p);
    });
  } else {
    page.innerHTML = `<h1>Variant B: two-line Crew threads (${themeName})</h1>
      <p class="lead">Same grouping, but every open thread shows its details all the time: rows are two lines (42 px), with no hover needed.</p>
      <ul>
        <li><span class="dot"></span><span><b>Line one:</b> status, title, and the time (elapsed in accent while working).</span></li>
        <li><span class="dot"></span><span><b>Line two:</b> the agent’s mark, the branch, and on the right the PR number, or the diff when there’s no PR yet.</span></li>
        <li><span class="dot"></span><span><b>Needs you</b> puts Crew’s question on line two in amber, so you can answer without guessing which thread it is.</span></li>
        <li><span class="dot"></span><span><b>Done</b> threads stay one line (title and PR) to keep the list short. ${foldNote}</span></li>
        <li><span class="dot"></span><span><b>Sessions</b> below lists only the ones you started, never a Crew thread, drawn as today.</span></li>
      </ul>${legend}`;
  }
}
</script>
</body>
</html>
