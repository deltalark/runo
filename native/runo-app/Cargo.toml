[package]
name = "runo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runo's native desktop client"

build = "build.rs"

[[bin]]
name = "Runo"
path = "src/main.rs"

# App bundle metadata for `cargo bundle` (macOS .app, Linux .deb).
[package.metadata.bundle]
name = "Runo"
identifier = "dev.runo.app"
icon = [
    "assets/icon/png/runo-32.png",
    "assets/icon/png/runo-128.png",
    "assets/icon/png/runo-256.png",
    "assets/icon/png/runo-512.png",
    "assets/icon/png/runo-1024.png",
    "assets/icon/runo.icns",
]
category = "public.app-category.developer-tools"
short_description = "Run coding agents side by side"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = { path = "../../vendor/portable-pty" }
vt100 = { path = "../../vendor/vt100" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
# The architecture editor: draw.io files (XML, sometimes deflated) and PNG export.
roxmltree = "0.21"
flate2 = "1"
resvg = "0.45"
# Design screens drawn in Runo itself: HTML and CSS laid out and painted without a browser.
blitz-html = "=0.3.0-beta.3"
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["svg", "woff", "system-fonts", "floats"] }
blitz-traits = "=0.3.0-beta.3"
blitz-paint = { version = "=0.3.0-beta.3", default-features = false, features = ["svg"] }
anyrender = "0.14"
anyrender_vello_cpu = "0.18"
# The pairing code `runo --phone` prints in the terminal.
qrcode = { version = "0.14", default-features = false }

[build-dependencies]
embed-resource = "3.0.11"
