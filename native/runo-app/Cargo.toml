[package]
name = "runo-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Runo's native GPUI desktop client"

[[bin]]
name = "runo-native"
path = "src/main.rs"

[dependencies]
gpui-kit = { version = "0.7.1", features = [
    "tree-sitter-bash",
    "tree-sitter-css",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-javascript",
    "tree-sitter-make",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
portable-pty = { path = "../../vendor/portable-pty" }
vt100 = "0.15"
serde.workspace = true
serde_json.workspace = true
