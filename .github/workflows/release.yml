# Builds Runo.app for Apple silicon and Intel Macs and packages a zip and a disk image of
# each, builds Runo for x86_64 and arm64 Linux as a .deb and a tarball, and builds Runo.exe
# for 64-bit Windows as a zip. Every run
# uploads them as workflow artifacts. On a version tag (v1.2.3) they are
# also attached to the GitHub release, which Runo's in-app updater downloads from.
# Run it by hand from the Actions tab for a test build of any branch. Signing and
# notarization run only when their secrets are set.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x86_64
    # The Apple secrets are set on the steps that need them, never on the job, so build
    # scripts and third-party actions can't read them.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check which signing secrets are set
        id: secrets
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          sign=false; notarize=false
          if [ -n "$APPLE_CERT_P12" ] && [ -n "$APPLE_CERT_PASSWORD" ]; then sign=true; fi
          if [ "$sign" = true ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then notarize=true; fi
          # Until the Apple secrets are set, releases ship signed ad hoc, as before, so
          # macOS asks before opening them. Say so loudly on a tag.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$notarize" != true ]; then
            echo "::warning::This release isn't signed and notarized: set the Apple signing and notarization secrets."
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build Runo.app
        working-directory: native/runo-app
        run: cargo bundle --release --target ${{ matrix.target }}

      - name: Find the app
        id: app
        run: |
          app="target/${{ matrix.target }}/release/bundle/osx/Runo.app"
          test -d "$app"
          echo "path=$app" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="Runo-${GITHUB_REF_NAME#v}-macos-${{ matrix.arch }}"
          else
            # Test builds carry the commit so they never look like a release.
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            name="Runo-$version-macos-${{ matrix.arch }}-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/runo.keychain-db"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p runo "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p runo "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k runo "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Sign the app
        if: steps.secrets.outputs.sign == 'true'
        run: |
          identity=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          test -n "$identity"
          codesign --force --deep --options runtime --timestamp --sign "$identity" "${{ steps.app.outputs.path }}"
          codesign --verify --deep --strict "${{ steps.app.outputs.path }}"

      - name: Sign the app without a certificate
        if: steps.secrets.outputs.sign != 'true'
        run: |
          echo "::warning::No signing certificate is set, so this build is signed ad hoc and macOS will ask before opening it."
          codesign --force --deep --sign - "${{ steps.app.outputs.path }}"

      - name: Notarize the app
        if: steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "${{ steps.app.outputs.path }}"

      - name: Package a zip and a disk image
        run: |
          mkdir -p dist dmg
          ditto -c -k --keepParent "${{ steps.app.outputs.path }}" "dist/${{ steps.app.outputs.name }}.zip"
          cp -R "${{ steps.app.outputs.path }}" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Runo -srcfolder dmg -ov -format UDZO "dist/${{ steps.app.outputs.name }}.dmg"

      - name: Sign and notarize the disk image
        if: steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          identity=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          codesign --force --timestamp --sign "$identity" "dist/${{ steps.app.outputs.name }}.dmg"
          xcrun notarytool submit "dist/${{ steps.app.outputs.name }}.dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "dist/${{ steps.app.outputs.name }}.dmg"

      - name: Remove the signing keychain
        if: always() && steps.secrets.outputs.sign == 'true'
        run: security delete-keychain "$RUNNER_TEMP/runo.keychain-db" || true

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.app.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Build Runo
        working-directory: native/runo-app
        run: cargo bundle --release --format deb

      - name: Name the build
        id: build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="Runo-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          else
            # Test builds carry the commit so they never look like a release.
            name="Runo-$version-linux-${{ matrix.arch }}-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package a .deb and a tarball
        run: |
          mkdir -p dist
          deb=$(ls target/release/bundle/deb/*.deb | head -1)
          test -n "$deb"
          # Match the window's app id so docks pair the window with the launcher's icon.
          root="$RUNNER_TEMP/deb"
          dpkg-deb -R "$deb" "$root"
          for desktop in "$root"/usr/share/applications/*.desktop; do
            grep -q '^StartupWMClass=' "$desktop" || echo 'StartupWMClass=runo' >> "$desktop"
          done
          dpkg-deb --root-owner-group -b "$root" "dist/${{ steps.build.outputs.name }}.deb"
          dpkg-deb -I "dist/${{ steps.build.outputs.name }}.deb"

          dir="$RUNNER_TEMP/${{ steps.build.outputs.name }}"
          mkdir -p "$dir"
          cp target/release/Runo "$dir/"
          cp native/runo-app/assets/linux/runo.desktop "$dir/"
          cp native/runo-app/assets/icon/png/runo-512.png "$dir/runo.png"
          cp LICENSE "$dir/"
          tar -C "$RUNNER_TEMP" -czf "dist/${{ steps.build.outputs.name }}.tar.gz" "${{ steps.build.outputs.name }}"

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-x86_64

      - name: Build Runo.exe
        run: cargo build --release -p runo

      - name: Name the build
        id: build
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="Runo-${GITHUB_REF_NAME#v}-windows-x86_64"
          else
            # Test builds carry the commit so they never look like a release.
            name="Runo-$version-windows-x86_64-${GITHUB_SHA::7}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Package a zip
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP/${{ steps.build.outputs.name }}"
          New-Item -ItemType Directory -Force -Path $dir, dist | Out-Null
          Copy-Item target/release/Runo.exe, LICENSE -Destination $dir
          Compress-Archive -Path $dir -DestinationPath "dist/${{ steps.build.outputs.name }}.zip"

      - name: Upload the build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: dist/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          generate_release_notes: true

  checksums:
    # Lists the SHA-256 of every file in the release in SHA256SUMS, signed with the
    # UPDATE_SIGNING_KEY secret (make it with scripts/update-key.sh). Runo's updater
    # refuses a download that doesn't match, or whose list isn't signed by update.pub.
    # Test builds get them too, as a workflow artifact, so a run by hand checks this job.
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List the checksums
        working-directory: dist
        run: |
          sha256sum -- * > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign the checksums
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          pub=$(tr -d '[:space:]' < native/runo-app/src/update.pub)
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            if [ -n "$pub" ]; then
              echo "::error::update.pub is set but UPDATE_SIGNING_KEY isn't, so Runo would refuse this release."
              exit 1
            fi
            echo "::warning::UPDATE_SIGNING_KEY isn't set, so SHA256SUMS is published unsigned. Run scripts/update-key.sh."
            exit 0
          fi
          umask 077
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl pkeyutl -sign -inkey "$RUNNER_TEMP/key.pem" -rawin -in SHA256SUMS | base64 -w0 > SHA256SUMS.sig
          rm "$RUNNER_TEMP/key.pem"
          # Check it against the key Runo is built with.
          printf '302a300506032b6570032100' | xxd -r -p > pub.der
          printf '%s' "$pub" | base64 -d >> pub.der
          base64 -d SHA256SUMS.sig > sig.bin
          openssl pkeyutl -verify -pubin -keyform DER -inkey pub.der -rawin -in SHA256SUMS -sigfile sig.bin

      - name: Upload the checksums
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SHA256SUMS
          path: SHA256SUMS*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" SHA256SUMS $(ls SHA256SUMS.sig 2>/dev/null) --clobber
