# Checks formatting, lints and tests on macOS and Linux, and lints the Windows
# build, for pull requests and pushes to main.
name: CI

# Pull request branches run once, through pull_request. Pushing to them (or a
# tag) would start a second identical run that neither run cancels.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev

      # The repository pins no toolchain, so CI uses the latest stable release.
      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      # Tests make commits in temporary repositories.
      - name: Configure git
        run: |
          git config --global user.name "Runo CI"
          git config --global user.email "ci@runo.invalid"
          git config --global init.defaultBranch main

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p runo --all-targets -- -D warnings

      - name: Test
        run: cargo test -p runo

  # Windows builds were first compiled at release time, so Unix-only code broke
  # the v0.5.7 release. This lints the app (not the tests, many of which need a
  # Unix shell) so a Windows break shows up on the pull request.
  windows:
    name: windows-latest (clippy)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable
          rustup default stable
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy -p runo -- -D warnings
