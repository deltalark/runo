# Checks formatting, lints and tests on every push and pull request, on macOS and Linux.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libfontconfig-dev libfreetype-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shm0-dev libxcb-xkb-dev \
            libwayland-dev libvulkan-dev

      # rust-toolchain.toml names the release; rustup installs it with rustfmt and clippy.
      - name: Install Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Tests make commits in temporary repositories.
      - name: Configure git
        run: |
          git config --global user.name "Runo CI"
          git config --global user.email "ci@runo.invalid"
          git config --global init.defaultBranch main

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -p runo --all-targets -- -D warnings

      - name: Test
        run: cargo test -p runo
