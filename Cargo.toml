[workspace]
resolver = "2"
members = ["native/runo-app", "native/runo-relay"]
exclude = ["vendor/portable-pty", "vendor/gpui-pre-apple", "vendor/vt100"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The desktop shell spends most of its time in long-lived Rust services (PTY,
# search, git, persistence and provider adapters).  Optimize those paths as one
# unit for production builds instead of using Cargo's throughput-oriented
# defaults.  Thin LTO keeps release builds practical while still optimizing
# across crate boundaries.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

# vt100 0.15 (vendored in vendor/vt100) subtracts with wrap-around when the view
# is scrolled back more than a screen; release builds rely on that, so debug
# builds must not trap on it.
[profile.dev.package.vt100]
overflow-checks = false

# Keep profiling builds representative of release performance while retaining
# symbols for Instruments, perf and flamegraph.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# gpui's macOS renderer with one blending fix for translucent (glass) windows; see
# vendor/gpui-pre-apple/src/metal_renderer.rs.
[patch.crates-io]
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
