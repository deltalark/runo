[workspace]
resolver = "2"
members = ["native/runo-app"]
exclude = ["vendor/block", "vendor/portable-pty", "vendor/gpui-pre-apple", "vendor/vt100"]

[workspace.package]
version = "0.5.11"
edition = "2021"
license = "MIT"
# The toolchain in rust-toolchain.toml; older ones aren't tested.
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The desktop shell spends most of its time in long-lived Rust services (PTY,
# search, git, persistence and provider adapters).  Optimize those paths as one
# unit for production builds instead of using Cargo's throughput-oriented
# defaults.  Thin LTO keeps release builds practical while still optimizing
# across crate boundaries.
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"

# Debug builds keep only line tables (file and line in backtraces and panics) for
# Runo itself and no debug info for dependencies. Full debug info for a crate this size
# made each rustc run take gigabytes of memory, on machines also running the agents,
# and on macOS its object files pile up in target/debug/deps by the gigabyte.
# `cargo build --profile profiling` still gives full symbols.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# vt100 0.15 (vendored in vendor/vt100) subtracts with wrap-around when the view
# is scrolled back more than a screen; release builds rely on that, so debug
# builds must not trap on it.
[profile.dev.package.vt100]
overflow-checks = false

# Screens are drawn as PNGs and decoded on every change; unoptimised, decoding takes
# hundreds of milliseconds a picture.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3

# Keep profiling builds representative of release performance while retaining
# symbols for Instruments, perf and flamegraph.
[profile.profiling]
inherits = "release"
debug = true
strip = "none"

# gpui's macOS renderer with one blending fix for translucent (glass) windows; see
# vendor/gpui-pre-apple/src/metal_renderer.rs.
#
# block 0.1.6 (pulled in by cocoa, metal and core-video under gpui) declares an
# uninhabited extern static, which newer compilers flag as a future hard error; see
# vendor/block/UPSTREAM.md.
[patch.crates-io]
block = { path = "vendor/block" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }
